version: "2"
run:
  concurrency: 4
  issues-exit-code: 1
  tests: true
linters:
  default: all
  # Linters added after this config was written that conflict with the existing API or style.
  disable:
    - depguard # needs an allow-list config to be useful
    - exhaustruct
    - exhaustruct_v5
    - forbidigo # the example prints its results
    - goconst
    - gomodguard # deprecated in favour of gomodguard_v2
    - ireturn # New returns the Lookuper interface by design
    - mnd # coordinates in tests and the example
    - paralleltest
    - tagliatelle # changing JSON tags would break the wire format
    - varnamelen
    - wsl # deprecated in favour of wsl_v5
  settings:
    dupl:
      threshold: 200
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - nolintlint
        path: \.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
